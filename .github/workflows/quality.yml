name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality-check:
    uses: RAM-Rogue-AI-Model/ram-infra/.github/workflows/reusable-sonar.yml@main
    with:
      project_key: ram-api-gateway
      sources: "."
      tests: "."
    secrets: inherit